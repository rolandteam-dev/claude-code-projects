name: Battr audit

# Daily lead-neglect audit of Follow Up Boss — the internal replacement for the
# Battr subscription. Nudges leads the assigned agent has gone quiet on, sweeps
# the ones past the neglect line into a pond, and posts an agent scoreboard.
#
# Runs at 7 PM PT, matching the time the paid Battr audit runs today.
#
# SAFETY: this is a DRY RUN unless the repository variable BATTR_LIVE is set to
# "true" (Settings → Secrets and variables → Actions → Variables). Leave it unset
# to shadow the paid product for a few weeks and compare the numbers first.
#
# Required secret: FUB_API_KEY
# Optional secrets: RESEND_API_KEY (emails the report), BATTR_WEBHOOK_URL (Slack)
# Optional variables: BATTR_LIVE, BATTR_SMART_LIST_ID, BATTR_REPORT_TO,
#                     BATTR_ALERT_CHANNEL, BATTR_REPORT_FROM

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC = 7 PM PT
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: "audit"
        options:
          - "audit"
          - "discover-lead-sources"
          - "inspect-fub-fields"
          - "census"
          - "test-email"
      mode:
        description: "Run mode (audit only)"
        type: choice
        default: "dry"
        options:
          - "dry"
          - "live"
      stage:
        description: "Which rules to act on"
        type: choice
        default: "both"
        options:
          - "both"
          - "at-risk"
          - "neglected"
      email_to:
        description: "Where to send the test email (task: test-email)"
        required: false
        type: string
      max_sweeps:
        description: "Override the per-run sweep cap (optional)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: battr-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      # Resolve the task ONCE, with a default.
      #
      # This used to be read as `inputs.task` directly in every step condition.
      # The `inputs` context is only populated for workflow_dispatch — on a
      # SCHEDULED run it is empty, so `inputs.task == 'audit'` was false and the
      # nightly 7 PM audit was skipped every single night while the run reported
      # success in fifteen seconds. Verified against runs #4 and #5.
      #
      # A default here makes a scheduled run mean "audit", which is the only
      # thing a schedule could sensibly mean.
      TASK: ${{ inputs.task || 'audit' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Self-test the rule engine
        run: node scripts/battr/selftest.mjs

      # A typo'd or unhandled task would skip every step and still go green —
      # the exact shape of the bug above. Refuse instead.
      - name: Check the task is one we handle
        run: |
          case "$TASK" in
            audit|discover-lead-sources|inspect-fub-fields|census|test-email) ;;
            *) echo "Unknown task '$TASK' — nothing would run." >&2; exit 1 ;;
          esac
          echo "Running task: $TASK"


      # Lists every lead source in the database with counts and current bucket,
      # so the mapping can be filled in without anyone running node locally.
      - name: Discover lead sources
        if: env.TASK == 'discover-lead-sources'
        env:
          FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
        run: |
          # pipefail: without it the pipe into tee masks a node failure and the
          # step "succeeds" with an empty report.
          set -o pipefail
          node scripts/battr/sources.mjs --discover | tee sources.txt
          {
            echo '## Lead sources'
            echo '```'
            cat sources.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Reports which fields a FUB person record actually carries, so a rule
      # depending on a mis-guessed field name is caught directly instead of
      # silently protecting or flagging nobody.
      - name: Inspect FUB fields
        if: env.TASK == 'inspect-fub-fields'
        env:
          FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
        run: |
          set -o pipefail
          node scripts/battr/inspect.mjs | tee fields.txt
          {
            echo '## FUB person fields'
            echo '```'
            cat fields.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # How many leads fall outside the audit, and why. The number Battr never
      # reported: nurture contacts with no timeframe, which matched none of its
      # four nurture lists and were therefore never audited at all.
      - name: Stage and timeframe census
        if: env.TASK == 'census'
        env:
          FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
        run: |
          set -o pipefail
          node scripts/battr/census.mjs | tee census.txt
          {
            echo '## Stage and timeframe census'
            echo '```'
            cat census.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Proves the Resend setup end to end without waiting for 7 PM. Sends a
      # sample agent digest and a sample report, both built from invented leads
      # — no FUB key, nothing read from the database.
      - name: Send a test email
        if: env.TASK == 'test-email'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BATTR_REPORT_FROM: ${{ vars.BATTR_REPORT_FROM }}
          BATTR_REPORT_TO: ${{ vars.BATTR_REPORT_TO }}
          BATTR_TEST_EMAIL_TO: ${{ inputs.email_to }}
        run: |
          set -o pipefail
          node scripts/battr/test-email.mjs | tee mail.txt
          {
            echo '## Test email'
            echo '```'
            cat mail.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the audit
        if: env.TASK == 'audit'
        env:
          FUB_API_KEY: ${{ secrets.FUB_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BATTR_WEBHOOK_URL: ${{ secrets.BATTR_WEBHOOK_URL }}
          BATTR_SMART_LIST_ID: ${{ vars.BATTR_SMART_LIST_ID }}
          BATTR_REPORT_TO: ${{ vars.BATTR_REPORT_TO }}
          # How agents are told: email (default), fub_task, or report_only.
          BATTR_ALERT_CHANNEL: ${{ vars.BATTR_ALERT_CHANNEL }}
          # From address on the per-agent emails. Must be on a domain verified
          # in Resend, or Resend refuses the send.
          BATTR_REPORT_FROM: ${{ vars.BATTR_REPORT_FROM }}
          # A manual run honors its own choice; the schedule honors the repo variable.
          BATTR_LIVE: ${{ inputs.mode == 'live' || (github.event_name == 'schedule' && vars.BATTR_LIVE == 'true') }}
        run: |
          node scripts/battr-audit.mjs \
            --stage="${{ inputs.stage || 'both' }}" \
            ${{ inputs.max_sweeps && format('--max-sweeps={0}', inputs.max_sweeps) || '' }}

      - name: Commit the audit trail
        if: env.TASK == 'audit'
        run: |
          if [ -z "$(git status --porcelain battr-logs/)" ]; then
            echo "Nothing to record."
            exit 0
          fi
          git config user.name "roland-luxury-bot"
          git config user.email "bot@therolandteam.com"
          git add battr-logs/
          git commit -m "Battr audit $(date -u +%Y-%m-%d)"
          # The schedule and a manual run can race; rebase rather than fail.
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((i * 5))
          done
          echo "Could not push the audit trail" >&2
          exit 1
