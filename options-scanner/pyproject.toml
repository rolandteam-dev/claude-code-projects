[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "options-scanner"
version = "0.1.0"
description = "Daily premium-selling scanner (cash-secured puts, put credit spreads). Finds and ranks; never places trades."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "yfinance>=0.2.40",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scanner = "scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
